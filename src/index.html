<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MDCard - Markdown 生成精美卡片</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <!-- Prevent flash of incorrect theme: set appearance before CSS loads -->
    <script>
      (function() {
        var appearance = localStorage.getItem('mdcard-appearance') || 'system';
        document.documentElement.setAttribute('data-appearance', appearance);
      })();
    </script>
    <link rel="stylesheet" href="./styles/main.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Vercel Speed Insights -->
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
    <div class="mc">
        <header class="mc__toolbar">
            <div class="mc__brand">
                <span class="mc__brand-icon">
                    <svg width="22" height="22" viewBox="0 0 1024 1024" fill="none">
                        <path d="M 276,750 Q 276,318 296,290 Q 492,544 512,556 Q 532,544 728,290 Q 748,318 748,750" stroke="url(#mcBrandGrad)" stroke-width="100" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        <defs>
                            <linearGradient id="mcBrandGrad" x1="0" y1="0" x2="1024" y2="1024">
                                <stop stop-color="#1BA784"/>
                                <stop offset="1" stop-color="#6ee7c7"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </span>
                <span class="mc__brand-text">MDCard</span>
            </div>
            <div class="mc__toolbar-right">
                <div class="mc__toolbar-status" id="mc-status"></div>
                <button class="mc__btn mc__autosave-btn" id="mc-autosave">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                    <span data-i18n="toolbar.autosave">自动保存</span>
                </button>
                <button class="mc__btn mc__btn--secondary" id="mc-drafts" data-i18n-title="draft.list">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M12 14l6-4"/><rect x="2" y="3" width="20" height="18" rx="2"/><rect x="2" y="3" width="20" height="18" rx="2" opacity="0.7"/><path d="M12 14l6-4" opacity="0.7"/></svg>
                    <span data-i18n="draft.label">草稿</span>
                </button>
                <span class="mc__toolbar-sep"></span>
                <button class="mc__btn mc__btn--secondary" id="mc-toggle-drawer">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                    <span data-i18n="toolbar.style">样式</span>
                </button>
                <button class="mc__btn mc__btn--primary" id="mc-export-png" disabled>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/><polyline points="12 18 12 12"/><polyline points="9 15 12 18 15 15"/></svg>
                    导出
                </button>
                <div class="mc__lang" id="mc-lang-area">
                    <button class="mc__btn mc__btn--ghost mc__lang-btn" id="mc-lang-btn">
                        <span id="mc-lang-label">English</span>
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    <div class="mc__lang-dropdown" id="mc-lang-dropdown">
                        <button class="mc__lang-option" data-lang="en">English</button>
                        <button class="mc__lang-option" data-lang="zh-CN">简体中文</button>
                        <button class="mc__lang-option" data-lang="zh-TW">繁體中文</button>
                        <button class="mc__lang-option" data-lang="ja">日本語</button>
                        <button class="mc__lang-option" data-lang="ko">한국어</button>
                    </div>
                </div>
                <a class="mc__btn mc__btn--ghost mc__github" href="https://github.com/FengX404/MDCard" target="_blank" rel="noopener noreferrer" title="GitHub">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>
                </a>

                <div class="mc__overflow" id="mc-overflow-area">
                    <button class="mc__btn mc__btn--icon mc__overflow-btn" id="mc-overflow-btn" aria-label="More">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
                    </button>
                    <div class="mc__overflow-menu" id="mc-overflow-menu">
                        <button class="mc__overflow-item mc__autosave-btn" id="mc-autosave-m">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                            <span data-i18n="toolbar.autosave">自动保存</span>
                        </button>
                        <button class="mc__overflow-item" id="mc-drafts-m" data-i18n-title="draft.list">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/></svg>
                            <span data-i18n="draft.label">草稿</span>
                        </button>
                        <div class="mc__overflow-item mc__overflow-lang" id="mc-lang-area-m">
                            <span class="mc__overflow-lang-label" id="mc-lang-label-m">English</span>
                            <div class="mc__overflow-lang-opts" id="mc-lang-opts-m">
                                <button class="mc__lang-option" data-lang="en">English</button>
                                <button class="mc__lang-option" data-lang="zh-CN">简体中文</button>
                                <button class="mc__lang-option" data-lang="zh-TW">繁體中文</button>
                                <button class="mc__lang-option" data-lang="ja">日本語</button>
                                <button class="mc__lang-option" data-lang="ko">한국어</button>
                            </div>
                        </div>
                        <a class="mc__overflow-item" href="https://github.com/FengX404/MDCard" target="_blank" rel="noopener noreferrer">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>
                            <span>GitHub</span>
                        </a>
                        <a class="mc__overflow-item" href="https://fengx404.com/about/" target="_blank" rel="noopener noreferrer">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            <span>关于作者</span>
                        </a>
                    </div>
                </div>

            </div>
        </header>

        <main class="mc__workspace">
            <section class="mc__editor mc__glass">
                <textarea class="mc__editor-input" id="mc-markdown" data-i18n-placeholder="editor.placeholder" placeholder="# 在此输入标题&#10;&#10;用 Markdown 编写内容...&#10;&#10;- **粗体** 和 *斜体*&#10;- 列表和 > 引用&#10;&#10;用 === 单独一行强制分页&#10;用 --- 渲染分割线"></textarea>
            </section>

            <div class="mc__sheet mc__sheet--collapsed" id="mc-sheet">
                <div class="mc__sheet-handle" id="mc-sheet-handle"></div>
                <div class="mc__sheet-header" id="mc-sheet-header">
                    <button class="mc__btn mc__btn--icon mc__sheet-back" id="mc-sheet-back">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                    </button>
                    <span class="mc__sheet-title" data-i18n="tab.preview">预览</span>
                </div>
                <section class="mc__preview" id="mc-preview">
                    <div class="mc__preview-empty" id="mc-preview-empty">
                        <div class="mc__preview-empty-icon">
                            <svg width="48" height="48" viewBox="0 0 64 64" fill="none">
                                <g transform="rotate(-6 32 32)">
                                    <rect x="8" y="12" width="48" height="40" rx="5" stroke="var(--mc-text-muted)" stroke-width="1.8" stroke-dasharray="4 4" stroke-linecap="round"/>
                                    <rect x="18" y="24" width="28" height="3" rx="1.5" fill="var(--mc-text-muted)" opacity="0.35"/>
                                    <rect x="18" y="32" width="20" height="3" rx="1.5" fill="var(--mc-text-muted)" opacity="0.25"/>
                                </g>
                            </svg>
                        </div>
                        <p data-i18n="editor.emptyPreview">输入 Markdown 即可预览卡片</p>
                    </div>
                    <div class="mc__preview-cards" id="mc-cards"></div>
                </section>
            </div>
        </main>

        <footer class="mc__footer">
            <span class="mc__footer-label" data-i18n="footer.links">友情链接</span>
            <a class="mc__footer-link" href="https://fengx404.com" target="_blank" rel="noopener noreferrer">FengX404</a>
        </footer>

        <aside class="mc__drawer" id="mc-drawer">
            <div class="mc__drawer-overlay" id="mc-drawer-overlay"></div>
            <div class="mc__drawer-panel mc__glass">
                <div class="mc__drawer-header">
                    <h3 class="mc__drawer-title" data-i18n="drawer.title">样式设置</h3>
                    <button class="mc__btn mc__btn--icon" id="mc-close-drawer">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="mc__drawer-body">
                    <div class="mc__group">
                        <h4 class="mc__group-title" data-i18n="drawer.ratio">画幅</h4>
                        <div class="mc__format" id="mc-format-area">
                            <button class="mc__btn mc__btn--ghost mc__format-btn" id="mc-format-btn">
                                <span id="mc-format-label">3:4 竖版</span>
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                            </button>
                            <div class="mc__format-dropdown" id="mc-format-dropdown">
                                <button class="mc__format-option active" data-format="portrait">3:4 竖版</button>
                                <button class="mc__format-option" data-format="story">9:16 长图</button>
                                <button class="mc__format-option" data-format="square">1:1 方形</button>
                                <button class="mc__format-option" data-format="wide">16:9 宽屏</button>
                            </div>
                            <select class="mc__select mc__format-select" id="mc-format" hidden>
                                <option value="portrait" data-i18n="format.portrait" selected>3:4 竖版</option>
                                <option value="story" data-i18n="format.story">9:16 长图</option>
                                <option value="square" data-i18n="format.square">1:1 方形</option>
                                <option value="wide" data-i18n="format.wide">16:9 宽屏</option>
                            </select>
                        </div>
                    </div>
                    <div class="mc__group">
                        <h4 class="mc__group-title" data-i18n="drawer.template">模板</h4>
                        <div class="mc__template-grid" id="mc-template-grid"></div>
                    </div>
                    <div class="mc__group">
                        <h4 class="mc__group-title" data-i18n="drawer.theme">主题</h4>
                        <div class="mc__theme-grid" id="mc-theme-grid"></div>
                    </div>
                    <div class="mc__group mc__group--collapsible">
                        <div class="mc__group-header">
                            <h4 class="mc__group-title" data-i18n="drawer.typography">排版</h4>
                            <svg class="mc__group-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </div>
                        <div class="mc__group-content">
                        <div class="mc__slider-row">
                            <label class="mc__slider-label" data-i18n="typo.h1">标题</label>
                            <input class="mc__slider" type="range" id="mc-h1" min="0" max="10" value="3">
                            <span class="mc__slider-val" id="mc-h1-val">20px</span>
                        </div>
                        <div class="mc__slider-row">
                            <label class="mc__slider-label" data-i18n="typo.h2">副标题</label>
                            <input class="mc__slider" type="range" id="mc-h2" min="0" max="10" value="5">
                            <span class="mc__slider-val" id="mc-h2-val">18px</span>
                        </div>
                        <div class="mc__slider-row">
                            <label class="mc__slider-label" data-i18n="typo.h3">三级标题</label>
                            <input class="mc__slider" type="range" id="mc-h3" min="0" max="10" value="3">
                            <span class="mc__slider-val" id="mc-h3-val">15px</span>
                        </div>
                        <div class="mc__slider-row">
                            <label class="mc__slider-label" data-i18n="typo.body">正文</label>
                            <input class="mc__slider" type="range" id="mc-body" min="0" max="10" value="3">
                            <span class="mc__slider-val" id="mc-body-val">14px</span>
                        </div>
                        <div class="mc__slider-row">
                            <label class="mc__slider-label" data-i18n="typo.lineHeight">行高</label>
                            <input class="mc__slider" type="range" id="mc-lh" min="0" max="10" value="2">
                            <span class="mc__slider-val" id="mc-lh-val">1.25</span>
                        </div>
                        </div>
                    </div>
                    <div class="mc__group mc__group--collapsible mc__group--collapsed">
                        <div class="mc__group-header">
                            <h4 class="mc__group-title" data-i18n="drawer.color">颜色</h4>
                            <svg class="mc__group-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </div>
                        <div class="mc__group-content">
                        <div class="mc__color-row">
                            <label class="mc__color-label" data-i18n="color.bg">背景</label>
                            <input class="mc__color-input" type="color" id="mc-bg" value="#1e1b4b">
                        </div>
                        <div class="mc__color-row">
                            <label class="mc__color-label" data-i18n="color.title">标题</label>
                            <input class="mc__color-input" type="color" id="mc-header-c" value="#e0e7ff">
                        </div>
                        <div class="mc__color-row">
                            <label class="mc__color-label" data-i18n="color.body">正文</label>
                            <input class="mc__color-input" type="color" id="mc-body-c" value="#c7d2fe">
                        </div>
                        </div>
                    </div>
                    <div class="mc__group mc__group--collapsible mc__group--collapsed">
                        <div class="mc__group-header">
                            <h4 class="mc__group-title" data-i18n="drawer.spacing">间距</h4>
                            <svg class="mc__group-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </div>
                        <div class="mc__group-content">
                        <div class="mc__slider-row">
                            <label class="mc__slider-label" data-i18n="spacing.padding">内边距</label>
                            <input class="mc__slider" type="range" id="mc-pad" min="0" max="10" value="3">
                            <span class="mc__slider-val" id="mc-pad-val">26px</span>
                        </div>
                        <div class="mc__slider-row">
                            <label class="mc__slider-label" data-i18n="spacing.marginY">上下留白</label>
                            <input class="mc__slider" type="range" id="mc-my" min="0" max="10" value="4">
                            <span class="mc__slider-val" id="mc-my-val">10px</span>
                        </div>
                        </div>
                    </div>
                    <div class="mc__group mc__group--collapsible mc__group--collapsed">
                        <div class="mc__group-header">
                            <h4 class="mc__group-title" data-i18n="drawer.border">边框</h4>
                            <svg class="mc__group-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </div>
                        <div class="mc__group-content">
                        <div class="mc__slider-row">
                            <label class="mc__slider-label" data-i18n="border.width">粗细</label>
                            <input class="mc__slider" type="range" id="mc-bw" min="0" max="10" value="0">
                            <span class="mc__slider-val" id="mc-bw-val">0px</span>
                        </div>
                        <div class="mc__color-row">
                            <label class="mc__color-label" data-i18n="border.color">颜色</label>
                            <input class="mc__color-input" type="color" id="mc-bc" value="#818cf8">
                        </div>
                        <div class="mc__slider-row">
                            <label class="mc__slider-label" data-i18n="border.radius">圆角</label>
                            <input class="mc__slider" type="range" id="mc-br" min="0" max="10" value="0">
                            <span class="mc__slider-val" id="mc-br-val">0px</span>
                        </div>
                        </div>
                    </div>
                    <div class="mc__group mc__group--collapsible mc__group--collapsed">
                        <div class="mc__group-header">
                            <h4 class="mc__group-title" data-i18n="drawer.watermark">水印</h4>
                            <svg class="mc__group-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </div>
                        <div class="mc__group-content">
                        <div class="mc__slider-row">
                            <label class="mc__slider-label" data-i18n="watermark.text">文字</label>
                            <input class="mc__text-input" type="text" id="mc-watermark" data-i18n-placeholder="watermark.placeholder" placeholder="留空关闭" maxlength="20">
                        </div>
                        </div>
                    </div>
                    <div class="mc__group mc__group--actions">
                        <button class="mc__btn mc__btn--ghost mc__btn--block" id="mc-reset" data-i18n="actions.reset">重置默认</button>
                        <button class="mc__btn mc__btn--secondary mc__btn--block" id="mc-share-config" data-i18n="actions.share">分享配置</button>
                    </div>
                </div>
            </div>
        </aside>

        <div class="mc__toast" id="mc-toast"></div>
    </div>

    <script type="module" src="./app/main.js"></script>
</body>
</html>
