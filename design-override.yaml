# MDCard 项目设计系统 Override
# 继承自 personal-design-system v0.2.0
project: MDCard
version: 1.0.0
based-on: "personal-design-system v0.2.0"

# ============================================================
# 暗色模式覆盖
# ============================================================

# 暗色模式表面使用绿色调代替设计系统默认中性灰色。
# 理由: MDCard 以"竹绿"为核心品牌标识，暗色模式采用
# 暗绿色毛玻璃美学 (#0d211a) 以维持项目视觉识别。
# 设计系统中性灰暗色模式 (#161616/#1E1E1E/#262626)
# 与项目品牌调性不匹配。
dark-mode-surfaces:
  page-bg: "#161616"           # 设计系统默认值，保持不变
  surface-bg: "#0d211a"         # Project Override: 暗绿色代替 #1E1E1E
  glass-bg: "rgba(13,33,26,0.82)"  # Project Override: 暗绿毛玻璃
  toolbar-bg: "rgba(8,20,16,0.85)" # Project Override: 暗绿毛玻璃
  reason: "维持 MDCard 暗绿色毛玻璃项目视觉识别"

# 暗色模式文字色使用绿色调代替设计系统灰度文字。
# 理由: 暗绿背景上绿色调文字比中性灰更协调，
# 呼应品牌色的同时保证可读性。
dark-mode-text:
  text-primary: "#e8f0ec"       # Project Override: 浅绿白代替灰色正文
  text-secondary: "#8dd8c0"     # Project Override: 薄荷绿代替灰色辅助文字
  text-muted: "#5a8a7a"         # Project Override: 暗绿代替灰色占位文字
  reason: "暗绿背景上绿色调文字协调性优于中性灰"

# ============================================================
# 创意调色板
# ============================================================

# 卡片输出提供 10 种调色板供用户选择，其中 4 种（暗蓝暖调、
# 暗棕复古、琥珀金调、暖米深褐、薄荷清新、天蓝商务、玫瑰粉调）
# 使用设计系统令牌之外的创意色。
# 理由: MDCard 是卡片生成工具，用户期望丰富的调色板多样性；
# 这些颜色仅用于卡片输出内容，不用于 UI 界面。
custom-palettes:
  - "暗蓝暖调 (#0b121f / #fdf3d1 / #b8a88a)"
  - "暗棕复古 (#181412 / #f2e9d8 / #b4a494)"
  - "琥珀金调 (#3a2008 / #fef0c5 / #cfa050)"
  - "暖米深褐 (#faf5ed / #3a2818 / #261c12)"
  - "薄荷清新 (#e4f4ef / #071712 / #13241d)"
  - "天蓝商务 (#eef4ff / #162e6e / #1a2844)"
  - "玫瑰粉调 (#fdf1f3 / #5c162e / #421425)"
  reason: "卡片生成工具需要丰富的创意调色板选项，仅限卡片输出内容使用"
